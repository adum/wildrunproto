<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="128" height="128" role="img" aria-label="Passive shop icon">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"></stop>
      <stop offset="100%" stop-color="#0f766e"></stop>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"></stop>
      <stop offset="100%" stop-color="#38bdf8"></stop>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"></stop>
      <stop offset="100%" stop-color="#94a3b8"></stop>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2.5" flood-color="#000" flood-opacity="0.3"></feDropShadow>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="48" cy="88" rx="24" ry="6" fill="#000" opacity="0.18"></ellipse>

  <!-- aura ring -->
  <g filter="url(#softShadow)">
    <circle cx="48" cy="44" r="26" fill="url(#ring)" stroke="#000" stroke-width="4"></circle>
  </g>

  <!-- shield -->
  <g filter="url(#softShadow)">
    <path
      d="M48 18L70 28V46c0 16-11 26-22 32C37 72 26 62 26 46V28z"
      fill="url(#shield)"
      stroke="#000"
      stroke-width="4"
      stroke-linejoin="round"
    ></path>
    <path d="M48 30v26M35 43h26" stroke="#0f172a" stroke-width="4" stroke-linecap="round"></path>
  </g>

  <!-- base plinth -->
  <g filter="url(#softShadow)">
    <rect x="28" y="70" width="40" height="12" rx="4" fill="url(#base)" stroke="#000" stroke-width="4"></rect>
  </g>
</svg>
